name: Run crawler

on:
  # 🕗 定时已交给 Cloudflare cron 主动触发（每天北京 08:30），
  #    GitHub 自带 schedule 存在严重延迟（曾从 08:37 拖到 15:54），会造成重复运行
  workflow_dispatch:
    inputs:
      limit:
        description: "每个分类抓取条数（默认 100，调试用 20）"
        required: false
        default: "100"
      crawl_only:
        description: "只跑指定爬虫（如 douban_variety），留空跑全部"
        required: false
        default: ""

concurrency:
  group: crawler-run
  cancel-in-progress: false

jobs:
  crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRAWL_ONLY: tmdb_popular_tv,tmdb_popular_movies
      CRAWL_LIMIT: '20'
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      PUBLIC_TMDB_API_BASE_URL: ${{ vars.PUBLIC_TMDB_API_BASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Bun 官网/Release CDN 偶发 504（2026-11-08 就因此整次采集失败），
      # 这里固定版本 + 加缓存，并对下载失败自动重试。
      - name: Set up Bun cache key
        id: bun-cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ steps.bun-cache-key.outputs.date }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        continue-on-error: true

      - name: Setup Bun (retry)
        id: setup-bun-retry
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        continue-on-error: true

      - name: Setup Bun (final retry)
        if: steps.setup-bun.outcome == 'failure' && steps.setup-bun-retry.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Incremental crawl — popular TV and movies only
        run: bun run crawler:run
      - name: Backfill ratings and artwork — same two categories only
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          MOVIE_API_BASE: ${{ vars.MOVIE_API_BASE || 'https://movie-api.l3okuu.workers.dev' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TOP_N: '20'
          TOP_ONLY: '1'
        run: |
          for category in tmdb_popular_tv tmdb_popular_movies; do
            export CATEGORY_FILTER="$category"
            bun run scripts/auto-extract.ts
            bun run scripts/backfill-ratings.ts "$category"
          done
