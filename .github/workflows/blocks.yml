name: Refresh blocks

# Refresh cadence is folder-based, decided by the admin when placing a script:
#   scripts/blocks/daily/    -> every day
#   scripts/blocks/weekly/   -> every Sunday
#   scripts/blocks/monthly/  -> 1st of each month
#   scripts/blocks/manual/   -> only via workflow_dispatch
on:
  schedule:
    # Off-peak UTC, staggered after crawler (02:17) to reduce hosted-runner contention
    - cron: "23 3 * * *" # daily group  (~11:23 CST)
    - cron: "23 4 * * 0" # weekly group (~12:23 CST Sunday)
    - cron: "23 5 1 * *" # monthly group (~13:23 CST 1st)
  workflow_dispatch:
    inputs:
      target:
        description: "daily | weekly | monthly | manual | single script path (e.g. weekly/bahamut-quarterly.ts)"
        required: true
        default: "manual"

concurrency:
  group: blocks-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Weekly Fusion feeds alone take ~35 minutes; keep publishing serial.
    timeout-minutes: 120
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      PUBLIC_TMDB_API_BASE_URL: ${{ vars.PUBLIC_TMDB_API_BASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
      BLOCKS_ADMIN_PASSWORD: ${{ secrets.BLOCKS_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Bun 官网/Release CDN 偶发 504（2026-11-08 就因此整次采集失败），
      # 这里固定版本 + 加缓存，并对下载失败自动重试。
      - name: Set up Bun cache key
        id: bun-cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ steps.bun-cache-key.outputs.date }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        continue-on-error: true

      - name: Setup Bun (retry)
        id: setup-bun-retry
        if: steps.setup-bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
        continue-on-error: true

      - name: Setup Bun (final retry)
        if: steps.setup-bun.outcome == 'failure' && steps.setup-bun-retry.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Run block scripts
        env:
          REFRESH_TARGET: ${{ github.event.inputs.target }}
        run: |
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            workflow_dispatch/*) target="$REFRESH_TARGET" ;;
            */"23 3 * * *") target="daily" ;;
            */"23 4 * * 0") target="weekly" ;;
            *) target="monthly" ;;
          esac
          echo "Target: $target"

          if [[ "$target" == *.ts ]]; then
            bun run "scripts/blocks/$target"
            exit $?
          fi

          shopt -s nullglob
          failed=0
          for f in "scripts/blocks/$target"/*.ts; do
            name="$(basename "$f")"
            [ "$name" = "_template.ts" ] && continue
            echo "▶ $f"
            bun run "$f" || { echo "::warning::$f failed"; failed=1; }
          done
          exit $failed
