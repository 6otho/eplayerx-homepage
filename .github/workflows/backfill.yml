name: Backfill ratings & assets

# 全量补全 评分 / Logo / 无字竖图
# 相比 Cloudflare Worker：无 48 次子请求限制，可以跑 6 小时，覆盖所有分类
on:
  # 🔗 联动：crawler 跑完自动触发 backfill（无需再单独设定时，也不会重叠）
  workflow_run:
    workflows: ["Run crawler"]
    types: [completed]
    branches: [main]
  # 兜底：万一联动没触发，每天 09:43（北京）再跑一次
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "只跑某个分类（留空=全部，例如 netflix_tv_minor）"
        required: false
        default: ""
      force:
        description: "强制重试已放弃的条目（1=是）"
        required: false
        default: ""
      top_only:
        description: "只补每个分类的前 20 条（1=是，其余交给每日任务）"
        required: false
        default: ""
      rebake_only:
        description: "只用现有缓存重刷数据文件，不查 API（1=是）"
        required: false
        default: ""
      no_extract:
        description: "跳过自动提取（1=跳过）"
        required: false
        default: ""

concurrency:
  group: backfill-ratings
  cancel-in-progress: false

jobs:
  backfill:
    # 🔗 crawler 跑完立即联动 backfill（补评分/logo，不发通知）；
    #    每天 10:30 还有一次兜底定时，确保周更数据也补上。
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
      MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ vars.R2_CUSTOM_DOMAIN }}
      CATEGORY_FILTER: ${{ github.event.inputs.category || '' }}
      FORCE_RETRY: ${{ github.event.inputs.force || '' }}
      # 默认只补前 20 条（轮播图范围）；手动触发时传 top_only=0 才全量
      TOP_ONLY: ${{ github.event.inputs.top_only || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun cache key
        id: bun-cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ steps.bun-cache-key.outputs.date }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --no-progress

      - name: Wait for CF weekly cron (最多等 50 分钟)
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        run: |
          echo "等待 Cloudflare 周更任务收尾…"
          for i in $(seq 1 50); do
            s=$(curl -s --max-time 20 "${{ vars.MOVIE_API_BASE || 'https://movie-api.l3okuu.workers.dev' }}/api/cron_status" || echo '{}')
            st=$(echo "$s" | sed -n 's/.*"status"[ ]*:[ ]*"\([A-Z]*\)".*/\1/p')
            echo "  [$i] cron status=$st"
            if [ "$st" != "RUNNING" ]; then echo "周更已结束"; break; fi
            sleep 60
          done

      - name: Snapshot before backfill
        continue-on-error: true
        run: node scripts/tg-snapshot.mjs save

      - name: Rebake from cache only (不消耗额度)
        if: github.event.inputs.rebake_only == '1'
        run: bun run scripts/rebake-only.ts

      # 🎯 关键：只有走「提取」接口客户端才会更新（实测验证）
      - name: Auto extract (触发客户端更新)
        if: github.event.inputs.no_extract != '1'
        env:
          MOVIE_API_BASE: ${{ vars.MOVIE_API_BASE || 'https://movie-api.l3okuu.workers.dev' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          # 只提取每个分类前 20 条（轮播图范围），不做全量
          TOP_N: "20"
          CATEGORY_FILTER: ${{ github.event.inputs.category || '' }}
        run: bun run scripts/auto-extract.ts

      - name: Sync ratings (重查 MDBList + 写缓存 + 烘焙数据文件)
        if: github.event.inputs.rebake_only != '1'
        run: bun run scripts/backfill-ratings.ts ${{ github.event.inputs.category || '' }}

      - name: Diff new items (找出新增条目)
        continue-on-error: true
        run: node scripts/tg-snapshot.mjs diff

      - name: Flush Telegram (合并爬虫 + 周更 + 评分补全，只发一条)
        if: always()
        continue-on-error: true
        env:
          WORKER_URL: ${{ vars.MOVIE_API_BASE || 'https://movie-api.l3okuu.workers.dev' }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: node scripts/tg-flush.mjs

