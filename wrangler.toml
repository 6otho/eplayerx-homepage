#:schema node_modules/wrangler/config-schema.json

name = "eplayerx-homepage"
main = "src/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Keep the default *.workers.dev address alive.
workers_dev = true

# Public routes for this Worker.
routes = [
	# 拦截所有子域名 (完美覆盖 epx, tmdb, 以及未来你随便乱造的任何前缀)
	{ pattern = "*.ikuu.eu.org/*", zone_name = "ikuu.eu.org" },
	{ pattern = "*.ikuux.cyou/*", zone_name = "ikuux.cyou" },

	# 拦截根域名 (为了兼容原代码里的 ikuu.eu.org/blocks* 路径)
	{ pattern = "ikuu.eu.org/*", zone_name = "ikuu.eu.org" },
	{ pattern = "ikuux.cyou/*", zone_name = "ikuux.cyou" },
]

[placement]
mode = "smart"

[observability]
enabled = true

# Public tvOS subtitle translation. Store DEEPSEEK_API_KEY with wrangler secret put.
# All devices behind the same public IP share this quota.
# shortcut: per-IP limits are approximate per Cloudflare location, not a global spending cap.
[[ratelimits]]
name = "SUBTITLE_RATE_LIMITER"
namespace_id = "20261011"
simple = { limit = 60, period = 60 }

# Limit uncached paid rating lookups per IP, including workers.dev traffic.
# shortcut: per-location limits reduce abuse, not a global spending cap.
[[ratelimits]]
name = "RATINGS_RATE_LIMITER"
namespace_id = "20261014"
simple = { limit = 60, period = 60 }

# Limit episode timing lookups and submissions.
[[ratelimits]]
name = "EPISODE_TIMING_RATE_LIMITER"
namespace_id = "20261106"
simple = { limit = 30, period = 60 }

# 👇 【自定义】环境变量（Blocks 管理密码）
[vars]

BLOCKS_ADMIN_PASSWORD = "080808"

# D1 database for EplayerX Blocks (community submissions + approved blocks).
[[d1_databases]]
binding = "DB"
database_name = "blocks"
database_id = "c3a09032-48ce-471c-a0cb-0b91a170103c"
migrations_dir = "migrations"

# Existing crawler/snapshot bucket (served publicly via assets.ikuu.eu.org).
# Bound so the admin panel can upload collection child logos directly.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "crawler"

# Refresh ratings for the current Home trending movie/TV lists daily.
[triggers]
crons = ["17 6 * * *"]
